<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body style="margin:0;padding:0;background:#0a0505;font-family:Segoe UI,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0a0505;padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#140a0a;border:1px solid rgba(248,113,113,0.4);border-radius:14px;overflow:hidden;">
          <!-- Header -->
          <tr>
            <td style="background:linear-gradient(135deg,#7f1d1d,#dc2626);padding:28px 32px;text-align:center;">
              <div style="font-size:34px;line-height:1;">&#128128;</div>
              <div style="font-size:12px;letter-spacing:6px;color:#fecaca;font-weight:700;margin-top:8px;">O SISTEMA</div>
              <div style="font-size:24px;color:#fff5f5;font-weight:800;margin-top:6px;">PENALIDADE APLICADA</div>
              <div style="font-size:13px;color:#fecaca;margin-top:4px;">Você falhou com o Sistema</div>
            </td>
          </tr>

          <!-- Player -->
          <tr>
            <td style="padding:24px 32px 8px;">
              <p style="margin:0 0 6px;color:#9ca3af;font-size:13px;">JOGADOR</p>
              <p style="margin:0;color:#f3f4f6;font-size:20px;font-weight:700;">{{USERNAME}}</p>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-top:16px;">
                <tr>
                  <td style="background:#1a0a0a;border:1px solid rgba(248,113,113,0.25);border-radius:10px;padding:14px;text-align:center;">
                    <span style="color:#9ca3af;font-size:11px;letter-spacing:2px;">NÍVEL</span><br/>
                    <span style="color:#f87171;font-size:22px;font-weight:800;">{{LEVEL}}</span>
                  </td>
                  <td style="width:12px;"></td>
                  <td style="background:#1a0a0a;border:1px solid rgba(248,113,113,0.25);border-radius:10px;padding:14px;text-align:center;">
                    <span style="color:#9ca3af;font-size:11px;letter-spacing:2px;">XP</span><br/>
                    <span style="color:#f87171;font-size:22px;font-weight:800;">{{XP}}</span>
                    <span style="color:#f87171;font-size:13px;font-weight:700;"> ({{XP_DELTA}})</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Verdict summary -->
          <tr>
            <td style="padding:16px 32px;">
              <div style="background:rgba(248,113,113,0.1);border-left:3px solid #dc2626;border-radius:8px;padding:14px 16px;color:#fca5a5;font-size:14px;line-height:1.5;">
                {{VERDICT_SUMMARY}}
              </div>
            </td>
          </tr>

          <!-- Evaluations -->
          <tr>
            <td style="padding:8px 32px;">
              <p style="color:#f3f4f6;font-size:15px;font-weight:700;margin:0 0 10px;">Avaliação das missões</p>
              {{VERDICT_ROWS}}
            </td>
          </tr>

          <!-- Tomorrow (inclui a Penalty Quest) -->
          <tr>
            <td style="padding:16px 32px;">
              <p style="color:#f3f4f6;font-size:15px;font-weight:700;margin:0 0 10px;">Imposições de amanhã</p>
              {{TOMORROW_ROWS}}
            </td>
          </tr>

          {{DEBT_BLOCK}}

          <!-- Footer -->
          <tr>
            <td style="padding:24px 32px;border-top:1px solid rgba(248,113,113,0.2);text-align:center;">
              <p style="color:#7f1d1d;font-size:12px;margin:0;">O fracasso tem custo. O Sistema não esquece.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
