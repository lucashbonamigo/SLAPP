services:
  api:
    build:
      context: .
      dockerfile: src/SoloLeveling.System.Api/Dockerfile
    container_name: sololeveling-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: ${DB_CONNECTION}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      ApiAuth__Password: ${API_PASSWORD}
      Storage__ProofsPath: /var/www/system_proofs
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN}
    volumes:
      - proofs:/var/www/system_proofs

  worker:
    build:
      context: .
      dockerfile: src/SoloLeveling.System.Worker/Dockerfile
    container_name: sololeveling-worker
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Default: ${DB_CONNECTION}
      Worker__RunAt: "21:30:00"
      Worker__PlayerUserId: "1"
      Gemini__ApiKey: ${GEMINI_API_KEY}
      Gemini__Model: gemini-flash-lite-latest
      Gemini__BaseUrl: https://generativelanguage.googleapis.com
      SystemRules__FeePerFailure: "10"
      SystemRules__BonusChancePercent: "5"
      SystemRules__MaxTaskMinutes: "60"
      SystemRules__DailyTaskCount: "3"
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__UseSsl: "true"
      Smtp__Username: ${SMTP_USER}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__FromAddress: ${SMTP_FROM}
      Smtp__FromName: "O Sistema"
      Storage__ProofsPath: /var/www/system_proofs
    volumes:
      - proofs:/var/www/system_proofs

volumes:
  proofs:
